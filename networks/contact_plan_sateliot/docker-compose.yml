services:
  node0:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node0
    privileged: true
    hostname: SATELIOT_1
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_sateliot/node0.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_sateliot/node0.toml
    networks:
      net-node0-node5:
        mac_address: 00:00:00:05:00:00
      net-node0-node1:
        mac_address: 00:00:00:01:00:00
    deploy:
      resources:
        limits:
          cpus: '1.0'
  node1:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node1
    privileged: true
    hostname: SATELIOT_2
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_sateliot/node1.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_sateliot/node1.toml
    networks:
      net-node1-node5:
        mac_address: 00:01:00:05:00:01
      net-node0-node1:
        mac_address: 00:00:00:01:00:01
      net-node1-node4:
        mac_address: 00:01:00:04:00:01
    deploy:
      resources:
        limits:
          cpus: '1.0'
  node2:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node2
    privileged: true
    hostname: SATELIOT_3
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_sateliot/node2.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_sateliot/node2.toml
    networks:
      net-node2-node4:
        mac_address: 00:02:00:04:00:02
      net-node2-node5:
        mac_address: 00:02:00:05:00:02
    deploy:
      resources:
        limits:
          cpus: '1.0'
  node3:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node3
    privileged: true
    hostname: SATELIOT_4
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_sateliot/node3.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_sateliot/node3.toml
    networks:
      net-node3-node4:
        mac_address: 00:03:00:04:00:03
      net-node3-node5:
        mac_address: 00:03:00:05:00:03
    deploy:
      resources:
        limits:
          cpus: '1.0'
  node4:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node4
    privileged: true
    hostname: GS_Barcelona
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_sateliot/node4.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_sateliot/node4.toml
    networks:
      net-node2-node4:
        mac_address: 00:02:00:04:00:04
      net-node3-node4:
        mac_address: 00:03:00:04:00:04
      net-node1-node4:
        mac_address: 00:01:00:04:00:04
    deploy:
      resources:
        limits:
          cpus: '1.0'
  node5:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node5
    privileged: true
    hostname: GS_Tokyo
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_sateliot/node5.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_sateliot/node5.toml
    networks:
      net-node0-node5:
        mac_address: 00:00:00:05:00:05
      net-node1-node5:
        mac_address: 00:01:00:05:00:05
      net-node2-node5:
        mac_address: 00:02:00:05:00:05
      net-node3-node5:
        mac_address: 00:03:00:05:00:05
    deploy:
      resources:
        limits:
          cpus: '1.0'
  capture:
    image: nicolaka/netshoot
    container_name: capture
    network_mode: host
    entrypoint:
    - sh
    - /repo/networks/capture.sh
    privileged: true
    environment:
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
      PLAN_NAME: contact_plan_sateliot
    volumes:
    - ../..:/repo
  metrics:
    build:
      context: ../..
      dockerfile: Dockerfile.metrics
    container_name: metrics
    environment:
      PLAN_NAME: contact_plan_sateliot
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
      METRICS_OUT: /repo/networks/contact_plan_sateliot/captures/${TEST_CASE_NUMBER}/metrics.jsonl
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ../..:/repo
    command:
    - python3
    - /repo/networks/get_metrics.py
networks:
  net-node0-node1:
    driver: bridge
    enable_ipv6: true
  net-node0-node5:
    driver: bridge
    enable_ipv6: true
  net-node1-node4:
    driver: bridge
    enable_ipv6: true
  net-node1-node5:
    driver: bridge
    enable_ipv6: true
  net-node2-node4:
    driver: bridge
    enable_ipv6: true
  net-node2-node5:
    driver: bridge
    enable_ipv6: true
  net-node3-node4:
    driver: bridge
    enable_ipv6: true
  net-node3-node5:
    driver: bridge
    enable_ipv6: true
