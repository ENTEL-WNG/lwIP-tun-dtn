services:
  node1:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node1
    privileged: true
    hostname: node1
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_ping_cgr/node1.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_ping_cgr/node1.toml
    networks:
      net-node1-node2:
        mac_address: 00:01:00:02:00:01
    deploy:
      resources:
        limits:
          cpus: '1.0'
  node2:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node2
    privileged: true
    hostname: node2
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_ping_cgr/node2.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_ping_cgr/node2.toml
    networks:
      net-node1-node2:
        mac_address: 00:01:00:02:00:02
      net-node2-node3:
        mac_address: 00:02:00:03:00:02
      net-node2-node5:
        mac_address: 00:02:00:05:00:02
    deploy:
      resources:
        limits:
          cpus: '1.0'
  node3:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node3
    privileged: true
    hostname: node3
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_ping_cgr/node3.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_ping_cgr/node3.toml
    networks:
      net-node2-node3:
        mac_address: 00:02:00:03:00:03
      net-node3-node4:
        mac_address: 00:03:00:04:00:03
    deploy:
      resources:
        limits:
          cpus: '1.0'
  node4:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node4
    privileged: true
    hostname: node4
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_ping_cgr/node4.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_ping_cgr/node4.toml
    networks:
      net-node3-node4:
        mac_address: 00:03:00:04:00:04
      net-node4-node5:
        mac_address: 00:04:00:05:00:04
    deploy:
      resources:
        limits:
          cpus: '1.0'
  node5:
    build:
      context: ../..
      dockerfile: Dockerfile.node
    container_name: node5
    privileged: true
    hostname: node5
    environment:
      DTN_CONFIG_PATH: /repo/networks/contact_plan_ping_cgr/node5.toml
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
    volumes:
    - ../..:/repo
    working_dir: /repo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - python3
    - /repo/init_node.py
    - /repo/networks/contact_plan_ping_cgr/node5.toml
    networks:
      net-node2-node5:
        mac_address: 00:02:00:05:00:05
      net-node4-node5:
        mac_address: 00:04:00:05:00:05
    deploy:
      resources:
        limits:
          cpus: '1.0'
  capture:
    image: nicolaka/netshoot
    container_name: capture
    network_mode: host
    entrypoint:
    - sh
    - /repo/networks/capture.sh
    privileged: true
    environment:
      TEST_CASE_NUMBER: ${TEST_CASE_NUMBER}
      PLAN_NAME: contact_plan_ping_cgr
    volumes:
    - ../..:/repo
  dtn_exporter:
    build:
      context: ../..
      dockerfile: Dockerfile.exporter
    container_name: dtn_exporter
    environment:
      PLAN_NAME: contact_plan_ping_cgr
      METRICS_OUT: /repo/networks/contact_plan_ping_cgr/captures/${TEST_CASE_NUMBER}/metrics.jsonl
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ../..:/repo
    command:
    - python3
    - /repo/networks/dtn_exporter.py
    networks:
    - monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: root
    volumes:
    - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./captures/${TEST_CASE_NUMBER}/prometheus:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    ports:
    - 9090:9090
    depends_on:
    - dtn_exporter
    networks:
    - monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: root
    volumes:
    - ./captures/${TEST_CASE_NUMBER}/grafana:/var/lib/grafana
    - ../grafana/provisioning:/etc/grafana/provisioning:ro
    - ../grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
    - 3000:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    depends_on:
    - prometheus
    networks:
    - monitoring
networks:
  net-node1-node2:
    driver: bridge
    enable_ipv6: true
  net-node2-node3:
    driver: bridge
    enable_ipv6: true
  net-node2-node5:
    driver: bridge
    enable_ipv6: true
  net-node3-node4:
    driver: bridge
    enable_ipv6: true
  net-node4-node5:
    driver: bridge
    enable_ipv6: true
  monitoring:
    driver: bridge
