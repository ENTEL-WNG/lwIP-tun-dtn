services:
  dtn_node_1:
    environment:
      IS_DOCKER: true
      APP_NAME: "fast monkey"
      DEBUG: true
      PS1: "dtn_node_1# "
      NODE: 1
      HOST_TUN_IPV6_ADDR: "fd00::1"
      HOST_LWIP_IPV6_ADDR: "fd00::2"
      INT_1: "enp0s8"
      INT_2: "enp0s9"
    build: .
    container_name: dtn_node_1
    privileged: true
    entrypoint: ["/root/init_dtn_node.sh"]
    devices:
      - "/dev/net/tun:/dev/net/tun"
    networks:
      - net_01  # 0 - 1
      - net_12  # 1 - 2
    cap_add:
      - NET_ADMIN
    
  dtn_node_2:
    environment:
      APP_NAME: "orange rabbit"
      DEBUG: true
      PS1: "dtn_node_2# "
      NODE: 2
      HOST_TUN_IPV6_ADDR: "fd00:22::1"
      HOST_LWIP_IPV6_ADDR: "fd00:22::2"
      INT_1: "enp0s8"
      INT_2: "enp0s9"
    build: .
    container_name: dtn_node_2
    privileged: true
    entrypoint: ["/root/init_dtn_node_2.sh"]
    devices:
      - "/dev/net/tun:/dev/net/tun"
    networks:
      - net_12  # 1 - 2
      - net_23  # 2 - 3
    cap_add:
      - NET_ADMIN

networks:
  net_01:
    enable_ipv6: true
    internal: true
  net_12:
    enable_ipv6: true
    internal: true
  net_23:
    enable_ipv6: true
    internal: true